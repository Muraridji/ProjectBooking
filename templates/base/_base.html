{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>
    {% block title %}

    {% endblock %}
  </title>
  <style>
    body {
        background: url('https://i.seadn.io/gae/Yuho0kQ154w8dl4TQjqhgeQ4zkJOJuCUctv7A4Opi8HBH8-FeQG49CRwBjMOTZu9M7IodvjIRAvzbxW5eiT-Saem9yst5lzwJ-YN-A?auto=format&dpr=1&w=1000') no-repeat center center fixed;
        background-size: cover;
    }


    .neon-text {
        color: #fff;
        text-shadow: 0 0 5px #00eaff, 0 0 10px #00eaff, 0 0 15px #00eaff;
    }

    @keyframes rainbowGlow {
        0%   { border-color: #ff0000; box-shadow: 0 0 10px #ff0000; }
        20%  { border-color: #ff7300; box-shadow: 0 0 10px #ff7300; }
        40%  { border-color: #fffb00; box-shadow: 0 0 10px #fffb00; }
        60%  { border-color: #48ff00; box-shadow: 0 0 10px #48ff00; }
        80%  { border-color: #00eaff; box-shadow: 0 0 10px #00eaff; }
        90%  { border-color: #ff00ff; box-shadow: 0 0 10px #ff00ff; }
        100% { border-color: #ff0000; box-shadow: 0 0 10px #ff0000; }
    }

    .neon-border {
        border: 2px solid #00eaff;
        box-shadow: 0 0 10px #00eaff;
        padding: 20px;
        border-radius: 10px;
        animation: rainbowGlow 3s infinite linear;
    }

    @keyframes rainbowGlowText {
        0%   { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; }
        20%  { text-shadow: 0 0 10px #ff7300, 0 0 20px #ff7300; }
        40%  { text-shadow: 0 0 10px #fffb00, 0 0 20px #fffb00; }
        60%  { text-shadow: 0 0 10px #48ff00, 0 0 20px #48ff00; }
        80%  { text-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff; }
        100% { text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff; }
    }

    .rainbow-text {
        font-size: 2em;
        font-weight: bold;
        color: white; /* или любой цвет текста */
        animation: rainbowGlowText 3s infinite linear;
    }



    .custom-link {
        font-weight: bold;
        color: #00eaff;
        text-decoration: none;
        transition: all 0.3s ease;
        position: relative;
    }

    .custom-link:hover {
        color: #fff;
        text-shadow: 0 0 10px #00eaff;
    }

    .text-outline {
            text-shadow:
                -1px -1px 2px #9400D3,
                 1px -1px 2px #9400D3,
                -1px  1px 2px #9400D3,
                 1px  1px 2px #9400D3;
        }

    @keyframes glowText {
        0% { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff; }
        50% { text-shadow: 0 0 15px #ff00ff, 0 0 30px #ff00ff, 0 0 45px #ff00ff; }
        100% { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff; }
    }

    .glowing-text {
        font-size: 2.5rem;
        font-weight: bold;
        color: white;
        animation: glowText 3s infinite alternate ease-in-out;
    }

  </style>

  <audio id="bg-music" loop>
      <source src="{% static 'audio/background.mp3' %}" type="audio/mpeg">
      Your browser does not support the audio element.
  </audio>

  <audio id="click-sound" src="{% static 'audio/submit.mp3' %}" preload="auto"></audio>
  <audio id="close-sound" src="{% static 'audio/close.mp3' %}" preload="auto"></audio>


  <script>
      const audio = document.getElementById("bg-music");

      function increaseVolume() {
          if (audio.volume < 1) {
              audio.volume = Math.min(1, audio.volume + 0.1);
          }
      }

      function decreaseVolume() {
          if (audio.volume > 0) {
              audio.volume = Math.max(0, audio.volume - 0.1);
          }
      }

      function togglePlay() {
          if (audio.paused) {
              audio.play();
          } else {
              audio.pause();
          }
      }
  </script>

  <script>
    // Звуковые эффекты
    const clickSound = document.getElementById('click-sound');
    const closeSound = document.getElementById('close-sound');

    clickSound.volume = 0.1;
    closeSound.volume = 0.1;

    // Звук при наведении (с обнулением, чтобы звук не заикался)
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll('.click-sound').forEach(button => {
            button.addEventListener('click', () => {
                clickSound.currentTime = 0;
                clickSound.play();
            });
        });
        document.querySelectorAll('.alt-click-sound').forEach(button => {
            button.addEventListener('click', () => {
                closeSound.currentTime = 0;
                closeSound.play();
            });
        });
    });

  </script>


<script>
    document.addEventListener("DOMContentLoaded", function () {
        const bgMusic = document.getElementById("bg-music");

        let isPlaying = localStorage.getItem("musicPlaying") === "true";
        let lastVolume = localStorage.getItem("musicVolume") || 1;
        let lastTime = sessionStorage.getItem("musicTime") || 0;

        bgMusic.volume = lastVolume;
        bgMusic.currentTime = lastTime; // Восстанавливаем позицию

        if (isPlaying) {
            bgMusic.play().catch(err => console.log("Автовоспроизведение заблокировано:", err));
        }

        // Сохраняем текущее время музыки перед сменой страницы
        window.addEventListener("beforeunload", function () {
            sessionStorage.setItem("musicTime", bgMusic.currentTime);
        });

        function togglePlay() {
            if (bgMusic.paused) {
                bgMusic.play();
                localStorage.setItem("musicPlaying", "true");
            } else {
                bgMusic.pause();
                localStorage.setItem("musicPlaying", "false");
            }
        }

        bgMusic.addEventListener("volumechange", function () {
            localStorage.setItem("musicVolume", bgMusic.volume);
        });

        window.togglePlay = togglePlay;
    });
</script>


</head>
<body>
{% include 'base/_header.html' %}

{% block content %}
{% endblock %}

{% include 'base/_footer.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
