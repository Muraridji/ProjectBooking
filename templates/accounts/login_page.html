{% extends 'base/_base.html' %}
{% load crispy_forms_tags %}

{% block title %}
    Login Page
{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100 text-light">
    <div class="neon-border p-4 rounded" style="max-width: 400px; width: 100%;">
        <h1 class="text-center glowing-text">Login</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                {{ form|crispy }}
            </div>
            <button type="submit" class="btn btn-neon w-100">Login</button>
        </form>
    </div>
</div>

<style>
    .btn-neon {
        background: #00eaff;
        color: #000;
        font-weight: bold;
        text-transform: uppercase;
        border: none;
        padding: 10px;
        transition: all 0.3s ease-in-out;
        box-shadow: 0 0 10px #00eaff;
    }

    .btn-neon:hover {
        background: #fff;
        color: #00eaff;
        box-shadow: 0 0 20px #00eaff;
    }

    .vh-100 {
        height: 100vh;
    }
</style>
{% endblock %}
