{% extends 'base/_base.html' %}
{% load crispy_forms_tags %}

{% block title %}
    Sign Up Page
{% endblock %}

{% block content %}
<div class="d-flex flex-column min-vh-100 justify-content-center align-items-center text-light">
    <div class="neon-border p-4 rounded mt-5 mb-5" style="max-width: 400px; width: 100%;">
        <h1 class="text-center glowing-text">Sign Up</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                {{ form|crispy }}
            </div>
            <button type="submit" class="btn btn-neon w-100">Sign Up</button>
        </form>
    </div>
</div>

<style>
    .btn-neon {
        background: #ff00ff;
        color: #000;
        font-weight: bold;
        text-transform: uppercase;
        border: none;
        padding: 10px;
        transition: all 0.3s ease-in-out;
        box-shadow: 0 0 10px #ff00ff;
    }

    .btn-neon:hover {
        background: #fff;
        color: #ff00ff;
        box-shadow: 0 0 20px #ff00ff;
    }
</style>

{% endblock %}
