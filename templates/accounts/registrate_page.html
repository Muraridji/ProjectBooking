{% extends 'base/_base.html' %}
{% load crispy_forms_tags %}

{% block title %}
    Sign up page
{% endblock %}

{% block content %}

<h1 class="text-center">Sign up page</h1>
<form method="POSt">
    {% csrf_token %}
    <div class="row justify-content-center">
        <div class="col-3">
            {{ form|crispy }}
            <button type="submit" class="btn btn-success btn-lg">Sign up</button>
        </div>
    </div>
</form>

{% endblock %}
