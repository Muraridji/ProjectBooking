<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список місць</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Усі місця</h1>

    <form id="filter-form" method="get">
        <label for="capacity">Мінімальна ємність:</label>
        <input type="number" id="capacity" name="capacity" min="1" value="{{ request.GET.capacity|default:'' }}">

        <label for="min_price">Мінімальна ціна:</label>
        <input type="number" id="min_price" name="min_price" min="0" value="{{ request.GET.min_price|default:'' }}">

        <label for="max_price">Максимальна ціна:</label>
        <input type="number" id="max_price" name="max_price" min="0" value="{{ request.GET.max_price|default:'' }}">

        <button type="submit">Фільтрувати</button>
    </form>

    <ul>
        {% for place in places %}
            <li>
                <h2>{{ place.title }}</h2>
                <p><strong>Опис:</strong> {{ place.body }}</p>
                <p><strong>Ціна:</strong> {{ place.price }} грн</p>
                <p><strong>Ємність:</strong> {{ place.capacity }} осіб</p>

                <form class="book-place-form" data-place-id="{{ place.id }}">
                    {% csrf_token %}
                    <label for="start_date_{{ place.id }}">Дата початку:</label>
                    <input type="date" id="start_date_{{ place.id }}" name="start_date" required>
                    
                    <label for="end_date_{{ place.id }}">Дата завершення:</label>
                    <input type="date" id="end_date_{{ place.id }}" name="end_date" required>
                    
                    <button type="submit">Зняти</button>
                </form>
            </li>
        {% empty %}
            <li>Немає доступних місць.</li>
        {% endfor %}
    </ul>

    <a href="{% url 'user_profile' %}">
        <button>Мій профіль</button>
    </a>

    <script>
        $(document).ready(function() {
            $('.book-place-form').on('submit', function(event) {
                event.preventDefault();
                
                var form = $(this);
                var placeId = form.data('place-id');
                var startDate = form.find('input[name="start_date"]').val();
                var endDate = form.find('input[name="end_date"]').val();
                
                if (!startDate || !endDate) {
                    alert('Будь ласка, виберіть дату початку та завершення.');
                    return;
                }
                
                $.ajax({
                    url: '{% url "book_place" 0 %}'.replace("0", placeId),
                    type: 'POST',
                    data: form.serialize(),
                    success: function(response) {
                        window.location.href = "{% url 'user_profile' %}";
                    },
                    error: function() {
                        alert('Не вдалося забронювати місце. Спробуйте ще раз.');
                    }
                });
            });
        });
    </script>
</body>
</html>
